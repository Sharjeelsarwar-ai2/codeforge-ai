# crew/config/tasks.yaml

requirement_analysis_task:
  description: >
    Analyze the following user idea and create a structured requirement document:
    
    **User Idea:** {user_idea}
    **Project Type:** {project_type}
    **Tech Preference:** {tech_preference}
    **Animation Level:** {animation_level}
    
    Create a detailed requirement document that includes:
    1. Project Overview (2-3 sentences)
    2. Target Audience
    3. Core Goals (3-5 goals)
    4. Pages Needed (list each page with purpose)
    5. Key Features per page
    6. Content Sections for each page
    7. Call-to-Action elements
    8. Technical Constraints
    9. Design Mood (modern, minimal, bold, corporate, creative, etc.)
    
    Be specific and actionable. Do not be vague.
  expected_output: >
    A structured requirement document in clear markdown format with all
    sections filled out specifically for this project.

product_planning_task:
  description: >
    Based on the requirement analysis, create a complete Product Requirement
    Document (PRD) and project plan:
    
    1. **PRD:**
       - Problem Statement
       - Solution Overview
       - Target Users & Personas
       - Core Features (prioritized as Must-Have, Nice-to-Have)
       - User Journey Flow
    
    2. **Sitemap:**
       - All pages with their routes
       - Navigation structure
       - Page hierarchy
    
    3. **MVP Scope:**
       - What to build in v1
       - What to defer
    
    4. **Tech Stack Recommendation:**
       - Frontend: HTML5, CSS3 (Tailwind or Pure CSS), Vanilla JS
       - Animations: GSAP, ScrollTrigger, AOS, or CSS animations
       - Any CDN links needed
  expected_output: >
    A comprehensive PRD document with sitemap, MVP scope, and tech stack
    recommendation in clean markdown format.

design_system_task:
  description: >
    Create a complete design system for this project. Be EXTREMELY specific
    with actual values:
    
    1. **Color Palette:**
       - Primary color (hex)
       - Secondary color (hex)
       - Accent color (hex)
       - Background colors (light, dark variants)
       - Text colors (heading, body, muted)
       - Gradient definitions
       - Success, Warning, Error colors
    
    2. **Typography:**
       - Heading font family (Google Fonts)
       - Body font family (Google Fonts)
       - Font sizes (h1 through h6, body, small)
       - Font weights
       - Line heights
       - Letter spacing
    
    3. **Spacing System:**
       - Base unit
       - Section padding
       - Component gaps
       - Container max-width
    
    4. **Components:**
       - Button styles (primary, secondary, outline)
       - Card styles
       - Input field styles
       - Border radius values
       - Box shadow values
    
    5. **CSS Custom Properties:**
       - Output a complete :root CSS block with all variables
    
    Make the design modern, beautiful, and suitable for: {user_idea}
  expected_output: >
    A complete design system document with ALL exact values (hex codes, px values,
    font names, etc.) and a ready-to-use CSS :root custom properties block.

animation_planning_task:
  description: >
    Plan all animations for this project with animation level: {animation_level}
    
    For EACH section of the website, specify:
    
    1. **Entrance Animations:**
       - Which elements animate in
       - Animation type (fade, slide, scale, rotate)
       - Direction (up, down, left, right)
       - Duration (in seconds)
       - Delay (stagger timing)
       - Easing function
    
    2. **Scroll Animations:**
       - ScrollTrigger configurations
       - Parallax effects
       - Progress-based animations
    
    3. **Hover Effects:**
       - Button hover states
       - Card hover effects
       - Link hover animations
    
    4. **Micro-interactions:**
       - Navigation toggle
       - Form focus states
       - Loading states
    
    5. **Provide actual code snippets** for:
       - GSAP ScrollTrigger setup
       - Key animation sequences
       - CSS transitions/animations
    
    Animation Level Guide:
    - Minimal: Subtle fades and slides only
    - Moderate: Scroll animations + hover effects + text reveals
    - Highly Animated: Full GSAP timeline + parallax + stagger + text split + cursor effects
  expected_output: >
    A detailed animation plan with exact GSAP/CSS code snippets for every
    section, including timing, easing, and trigger configurations.

architecture_planning_task:
  description: >
    Plan the complete file structure for this project:
    
    1. **Folder Structure:**
       - Root files
       - CSS directory structure
       - JS directory structure
       - Assets organization
       - Component organization (if applicable)
    
    2. **File Naming Conventions:**
       - CSS files (what each file contains)
       - JS files (what each file handles)
       - Naming pattern (kebab-case, etc.)
    
    3. **CSS Architecture:**
       - How to organize styles (by component, by page, or utility-first)
       - CSS custom properties location
       - Reset/normalize approach
       - Responsive breakpoints
    
    4. **JavaScript Architecture:**
       - Module organization
       - Event handling approach
       - Animation initialization
       - Utility functions
    
    5. **Complete File List:**
       - List EVERY file that needs to be created
       - Specify the purpose of each file
       - Specify the order of creation
    
    Output the exact file tree that will be created.
  expected_output: >
    A complete file structure plan with every file listed, its purpose
    described, and the creation order specified. Include the visual file tree.

frontend_development_task:
  description: >
    NOW WRITE ALL THE CODE. Generate COMPLETE, PRODUCTION-READY code for every
    file in the project.
    
    **CRITICAL RULES:**
    1. Write COMPLETE code for EVERY file — no placeholders, no TODOs, no "add more here"
    2. Every HTML file must have proper DOCTYPE, head, meta tags, and linked CSS/JS
    3. CSS must be fully responsive with mobile-first media queries
    4. JavaScript must be clean, modern (ES6+), and well-organized
    5. All animations from the animation plan must be implemented
    6. All design system values must be used consistently
    7. Navigation must work across all pages
    8. All buttons, links, and interactive elements must be functional
    9. Images should use placeholder services (picsum.photos or placehold.co)
    10. Include proper alt text for accessibility
    
    **FILE OUTPUT FORMAT:**
    For EACH file, output it in this exact format:
    
    === FILE: [relative/path/to/file.ext] ===
    ```[language]
    [complete file content]
=== END FILE ===

Generate ALL files listed in the architecture plan.
The project folder path is: {project_path}

IMPORTANT: Use the write_file tool to save each file to the project folder.
The file path should be: {project_path}/[relative/path/to/file.ext]
This runtime uses CrewAI's text-based ReAct tools. Never emit native JSON
function calls, tool_calls, or {{"name": ..., "arguments": ...}}. When a
tool is needed, use exactly this format and wait for the result:
Thought: <brief reasoning>
Action: write_file
Action Input: {{"file_path": "...", "content": "..."}}
expected_output: >
ALL project files written to disk using the write_file tool. Every file
must be complete, working, and production-ready. Return a summary of all
files created with their paths.

code_review_task:
description: >
Review ALL generated code files in the project at: {project_path}

Use the read_file tool to read each file and check for:

HTML Quality:

Semantic HTML5 elements used correctly

All tags properly closed

Proper meta tags present

Accessibility attributes (aria, alt, role)

SEO basics (title, meta description)

CSS Quality:

Responsive design works (check media queries)

No unused styles

Consistent naming conventions

Proper use of custom properties

No !important overuse

Color contrast accessibility

JavaScript Quality:

No errors or broken syntax

Event listeners properly attached

DOM ready handling

No global variable pollution

Proper error handling

Cross-file Consistency:

All CSS/JS files properly linked in HTML

File paths are correct

No broken references

Animation Quality:

GSAP properly initialized

ScrollTrigger configured correctly

Animations enhance UX

For EACH issue found, provide:

File path

Line/section reference

The exact problem

The exact fix (provide corrected code)

Use the validate_html, validate_css, and validate_javascript tools to help.
expected_output: >
A detailed code review report with all issues categorized by severity
(Critical, Major, Minor) and exact fixes provided for each issue.

qa_testing_task:
description: >
Perform comprehensive QA testing on the project at: {project_path}

Test the following:

Responsiveness Testing:

Mobile (320px - 480px)

Tablet (768px - 1024px)

Desktop (1280px+)

Check navbar, hero, sections, footer at each breakpoint

Functionality Testing:

All navigation links work

All buttons have hover states

Forms have proper validation styling

Smooth scroll works

Mobile menu toggle works

Visual Testing:

Text is readable at all sizes

Images don't overflow

No horizontal scroll on mobile

Proper spacing and alignment

Animations don't break layout

Accessibility Testing:

Color contrast ratios

Focus states on interactive elements

Alt text on images

Keyboard navigation

Performance:

No unnecessarily large files

CSS/JS not duplicated

Images optimized (using CDN)

Report all issues with severity: CRITICAL, HIGH, MEDIUM, LOW
expected_output: >
A QA test report with all issues listed, categorized by severity, with
steps to reproduce and expected behavior for each issue.

debug_and_fix_task:
description: >
Based on the code review and QA testing results, fix ALL identified issues
in the project at: {project_path}

For EACH issue:

Read the affected file using read_file

Understand the root cause

Write the corrected code

Use write_file to save the fixed file

IMPORTANT RULES:

Fix ALL critical and high-severity issues

Fix as many medium/low issues as possible

Do NOT introduce new issues while fixing

Maintain all existing functionality

Keep the design system consistent

Ensure all animations still work after fixes

After fixing, verify the files are correct by reading them again.
expected_output: >
A list of all fixes applied with before/after descriptions. All fixed
files should be saved to disk using write_file.

documentation_task:
description: >
Generate complete documentation and prepare the project for deployment.
Project path: {project_path}

Use the generate_readme tool to create a professional README.md

Use the generate_gitignore tool to create a .gitignore file

Use the save_project_metadata tool to save project metadata

The README should include:

Project name and description

Tech stack used

Features list

Setup instructions

File structure

Deployment guide (Netlify, GitHub Pages, Vercel)

Also create a deployment guide that covers:

Netlify drag & drop deployment

GitHub Pages deployment

Vercel deployment

Project name: {project_name}
Project description: {project_description}
expected_output: >
README.md, .gitignore, and project metadata files created and saved
to the project folder. Return confirmation of all files created
